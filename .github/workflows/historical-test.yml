name: UNPSYCHIC29 Historical Test

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical lookback days for this run"
        required: true
        default: "30"
        type: string
      max_symbols:
        description: "Maximum test symbols"
        required: true
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: unpsychic29-historical-test
  cancel-in-progress: false

jobs:
  historical-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify runner
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          uname -a
          df -h
          test -f requirements.txt
          test -f config/research.json
          test -f src/dhan_historical.py
          test -f src/research_metrics.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Static compile check
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src

      - name: Deterministic downloader self-test
        shell: bash
        run: |
          set -euo pipefail
          python src/dhan_historical.py --self-test

      - name: Validate Dhan credentials and Data API access
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("DHAN_ACCESS_TOKEN", "").strip()
          if not token:
              raise SystemExit("DHAN_ACCESS_TOKEN secret is missing.")

          response = requests.get(
              "https://api.dhan.co/v2/profile",
              headers={"Accept": "application/json", "access-token": token},
              timeout=30,
          )
          try:
              body = response.json()
          except ValueError:
              raise SystemExit(f"Dhan profile returned non-JSON HTTP {response.status_code}.")

          if response.status_code != 200:
              code = body.get("errorCode") or body.get("errorType") or "UNKNOWN"
              message = body.get("errorMessage") or "Dhan rejected the access token."
              raise SystemExit(f"Dhan authentication failed: {code}: {message}")
          if not body.get("dhanClientId"):
              raise SystemExit("Dhan profile response did not contain dhanClientId.")
          if str(body.get("dataPlan", "")).strip().lower() != "active":
              raise SystemExit(f"Dhan Data API is not active: {body.get('dataPlan')!r}")
          print("Dhan preflight: PASS")
          print(f"Data plan: {body.get('dataPlan')}")
          print(f"Token validity: {body.get('tokenValidity', 'unknown')}")
          PY

      - name: Download Dhan historical candles
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python src/dhan_historical.py \
            --config config/research.json \
            --days "${{ inputs.days }}" \
            --max-symbols "${{ inputs.max_symbols }}"

      - name: Calculate initial behaviour metrics
        shell: bash
        run: |
          set -euo pipefail
          python src/research_metrics.py --input artifacts/raw_1min --output artifacts/research

      - name: Write run manifest
        env:
          LOOKBACK_DAYS: ${{ inputs.days }}
          MAX_SYMBOLS: ${{ inputs.max_symbols }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          manifest = {
              "project": "UNPSYCHIC29",
              "purpose": "Dhan historical intraday research test",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "git_sha": os.environ["GITHUB_SHA"],
              "lookback_days": int(os.environ["LOOKBACK_DAYS"]),
              "max_symbols": int(os.environ["MAX_SYMBOLS"]),
              "interval_minutes": 1,
              "exchange_segment": "NSE_EQ",
              "instrument": "EQUITY",
          }
          Path("artifacts/run_manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          PY

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: unpsychic29-historical-test-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

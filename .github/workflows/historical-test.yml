name: UNPSYCHIC29 Historical Test

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical lookback days for this run"
        required: true
        default: "30"
        type: string
      max_symbols:
        description: "Maximum test symbols"
        required: true
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: unpsychic29-historical-test
  cancel-in-progress: false

jobs:
  historical-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify runner
        run: |
          python --version
          python -c "import platform; print(platform.platform())"
          df -h

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate Dhan credentials and data access
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: python src/dhan_preflight.py

      - name: Download Dhan historical candles
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: |
          python src/dhan_historical.py \
            --config config/research.json \
            --days "${{ inputs.days }}" \
            --max-symbols "${{ inputs.max_symbols }}"

      - name: Calculate initial behaviour metrics
        run: python src/research_metrics.py --input artifacts/raw_1min --output artifacts/research

      - name: Write run manifest
        env:
          LOOKBACK_DAYS: ${{ inputs.days }}
          MAX_SYMBOLS: ${{ inputs.max_symbols }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          manifest = {
              "project": "UNPSYCHIC29",
              "purpose": "Dhan historical intraday research test",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "git_sha": os.environ["GITHUB_SHA"],
              "lookback_days": int(os.environ["LOOKBACK_DAYS"]),
              "max_symbols": int(os.environ["MAX_SYMBOLS"]),
              "interval_minutes": 1,
              "exchange_segment": "NSE_EQ",
              "instrument": "EQUITY",
          }
          Path("artifacts/run_manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          PY

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: unpsychic29-historical-test-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
